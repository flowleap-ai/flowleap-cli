[package]
name = "flowleap-cli"
version = "0.4.1"
edition = "2021"
description = "One CLI for FlowLeap Patent AI — built for humans and AI agents"
authors = ["FlowLeap"]
license = "MIT"

[[bin]]
name = "flowleap"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive", "env", "color"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# JSON & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Config management
dirs = "6"

# Terminal output
colored = "3"
comfy-table = "7"
indicatif = "0.17"
dialoguer = { version = "0.11", features = ["password"] }

# Binary image payloads (figures --out)
base64 = "0.22"

# Error handling
anyhow = "1"
thiserror = "2"

# URL opening for OAuth
open = "5"

# Embedded agent skills (skills/ directory baked into the binary)
include_dir = "0.7"

# sha256 for `upgrade` self-update checksum verification. Already in the tree
# via rustls' TLS backend, so this direct dep adds no compile cost.
ring = "0.17"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# Skill↔CLI validation test: tokenize `flowleap …` examples in SKILL.md files
shell-words = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
