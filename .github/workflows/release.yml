name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fail loudly before building any artifact if the release tag, the Cargo
  # package version, and the npm package version disagree.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag == Cargo version == npm version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          NPM_VERSION="$(jq -r '.version' npm/package.json)"

          echo "tag=$TAG_VERSION cargo=$CARGO_VERSION npm=$NPM_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$NPM_VERSION" ]; then
            echo "::error::Version mismatch — tag '$TAG_VERSION', Cargo.toml '$CARGO_VERSION', npm/package.json '$NPM_VERSION' must all match. Bump Cargo.toml and npm/package.json to match the tag before releasing."
            exit 1
          fi

  build:
    needs: version-check
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: flowleap-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: flowleap-darwin-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: flowleap-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: flowleap-linux-aarch64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: flowleap-linux-x86_64-musl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: flowleap-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools (Linux x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/flowleap ${{ matrix.name }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/flowleap.exe ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*; do
              sha256sum "$file" >> ../checksums.txt
            done
          done
          cat ../checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            checksums.txt

  npm-publish:
    needs: release
    runs-on: ubuntu-latest

    # id-token lets npm attach signed provenance linking the package to this
    # exact repo, commit, and workflow run (visible on the npm package page).
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          # download.mjs reads the version from package.json at first run,
          # so bumping package.json here is sufficient.
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      - name: Verify npm package mirrors and tarball
        run: |
          cmp README.md npm/README.md
          cmp LICENSE npm/LICENSE
          cd npm
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          cd ..
          node scripts/verify-npm-package.mjs "$RUNNER_TEMP/npm-pack.json"

      - name: Publish to npm
        run: cd npm && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
